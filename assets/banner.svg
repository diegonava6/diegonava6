<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
  <title id="t">Diego Nava. Analog soul, digital craft.</title>
  <desc id="d">Senior engineer building web, mobile, and AI products.</desc>
  <defs>
    <radialGradient id="glow" cx="75%" cy="45%" r="55%">
      <stop offset="0" stop-color="#242630"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <filter id="rim" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1000" height="400" fill="#08090b"/>
  <rect width="1000" height="400" fill="url(#glow)"/>

  <g aria-hidden="true">
    <circle cx="772" cy="196" r="112" fill="#aaaabb" opacity=".16" filter="url(#halo)"/>
    <circle cx="776" cy="193" r="112" fill="#c5c6d5" filter="url(#rim)"/>
    <circle cx="772" cy="196" r="112" fill="#08090b"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.4">
    <text x="56" y="62" fill="#b6b6be">DIEGO NAVA / SENIOR ENGINEER</text>
    <text x="944" y="62" fill="#96969f" opacity=".7" text-anchor="end">IDEAS INTO SOFTWARE</text>
    <text x="944" y="82" fill="#96969f" opacity=".7" text-anchor="end">HUMAN × MACHINE</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="74" letter-spacing="-4" fill="#e6e4df">
    <text x="52" y="170">Analog soul,</text>
    <text x="52" y="246">digital <tspan fill="#c5c7ce" font-style="italic">craft.</tspan></text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#a6a6ac">
    <text x="56" y="296">I build web, mobile, and AI products.</text>
    <text x="56" y="322">Made with purpose. Built with care.</text>
  </g>

  <line x1="56" y1="352" x2="944" y2="352" stroke="#ffffff" stroke-opacity=".13"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#aaaab2">
    <text x="56" y="378">Product engineering · Web · Mobile · AI</text>
    <text x="944" y="378" text-anchor="end">Architecture · Delivery · Automation</text>
  </g>
</svg>
